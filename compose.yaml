services:
  postgres-loom:
    image: postgres:18
    container_name: postgres-loom-hub
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - loom_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  loom_data:
